<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- PaperSearch app icon: a paper sheet under a magnifier whose rim is a
       progress ring, flat like the progress capsule.
       Tile follows the macOS icon grid (824 px tile, 100 px margin). -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#2563eb"/>
  <rect x="250" y="214" width="392" height="512" rx="48" fill="#ffffff"/>
  <g fill="#bfd3fb">
    <rect x="314" y="300" width="190" height="34" rx="17"/>
    <rect x="314" y="376" width="264" height="34" rx="17"/>
    <rect x="314" y="452" width="214" height="34" rx="17"/>
  </g>
  <line x1="752" y1="722" x2="826" y2="796" stroke="#f59e0b" stroke-width="66" stroke-linecap="round"/>
  <circle cx="640" cy="610" r="132" fill="#eaf1ff"/>
  <circle cx="640" cy="610" r="132" fill="none" stroke="#fde7b0" stroke-width="46"/>
  <circle cx="640" cy="610" r="132" fill="none" stroke="#f59e0b" stroke-width="46" stroke-linecap="round"
          stroke-dasharray="600 830" transform="rotate(-90 640 610)"/>
  <rect x="562" y="590" width="156" height="42" rx="21" fill="#2563eb"/>
</svg>
