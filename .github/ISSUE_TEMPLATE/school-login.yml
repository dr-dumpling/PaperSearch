name: "学校登录不上 / 想支持我的学校 · School sign-in problem or school request"
description: "配置时找不到学校、所属联盟还不支持，或下载时没走到学校登录页。· Setup cannot find the school, its federation is not supported, or downloads never reach the school's sign-in page."
title: "[School] "
body:
  - type: input
    id: version
    attributes:
      label: "PaperSearch 版本 / Version"
      description: "运行 paper-search --version。· Run paper-search --version."
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: "操作系统 / Operating system"
      placeholder: "macOS / Windows，系统版本 / version"
    validations:
      required: true
  - type: input
    id: school
    attributes:
      label: "学校名称和官网域名 / School name and website domain"
      description: "学校的正式名称（当地语言或英文）和官网域名、所在国家或地区。不要填写账号、学号或姓名。· The school's official name (local language or English), its website domain, and country or region. No accounts, student IDs or names."
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: "配置时程序的回复 / What setup said"
      description: "配置学校时程序给出的结果：找到的联盟，或错误码与原因（school_not_found、federation_not_supported、school_ambiguous 等）。· The result of setting up the school: the federation it found, or the error code and reason."
    validations:
      required: true
  - type: textarea
    id: login
    attributes:
      label: "下载时停在哪一步 / Where the download stopped"
      description: "配置成功但登录不上时填写：出版社网站、一篇你有权限的文章 DOI、停在哪一页（出版社选校页、选了别的学校、学校登录页没被认出等）、程序给出的原因。只填公开网址，不粘贴学校登录页或带认证参数的网址。· When setup worked but sign-in did not: the publisher, the DOI of a paper you have access to, the page it stopped on, and the reason given. Public addresses only; no school login URLs or URLs with authentication parameters."
  - type: textarea
    id: report
    attributes:
      label: "失败记录包 / Failure report"
      description: "可选。运行 paper-search failures --export ./failure-report.zip --doi <DOI>，核对包内 summary.md 后将 ZIP 拖到这里。不要上传原始 diagnostics、Cookie 或浏览器 profile。· Optional. Run paper-search failures --export ./failure-report.zip --doi <DOI>, check summary.md inside, then drag the ZIP here. No raw diagnostics, cookies or browser profiles."
  - type: checkboxes
    id: privacy
    attributes:
      label: "公开前检查 / Before posting"
      options:
        - label: "我已检查文字、截图和附件，不含账号、密码、学号、验证码、邮箱、登录参数或其他个人信息。· I checked the text, screenshots and attachments for accounts, passwords, student IDs, verification codes, email, login parameters and other personal information."
          required: true
