name: 程序出错
description: 安装、命令、检索、进度胶囊等报错或结果不对（下载失败请用“下载失败”模板）。
title: "[出错] "
body:
  - type: input
    id: version
    attributes:
      label: PaperSearch 版本
      description: 运行 paper-search --version。
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 操作系统
      placeholder: macOS / Windows / Linux，系统版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎么出现的
      description: 运行的命令，或对 AI 说的话；能复现的话写出步骤。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与预期
      description: 报错信息可以直接粘贴；截图请拖到这里。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开前检查
      options:
        - label: 我已检查文字和截图，不含 API key、学校账号、姓名、邮箱或其他个人信息。
          required: true
