<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PaperSearch</title>
<style>
:root {
  /* Opaque: a transparent window has nothing behind it to blur, and the desktop showed
     through the card (user, 2026-11-10). */
  --bg: #ffffff; --fg: #111827; --dim: #6b7280; --faint: #9ca3af;
  --line: rgba(17, 24, 39, 0.10); --track: rgba(17, 24, 39, 0.10); --hover: rgba(17, 24, 39, 0.06);
  --accent: #2563eb; --ok: #16a34a; --bad: #dc2626;
  --warn: #92400e; --warn-bg: #fef3c7; --warn-line: #f3d27a; --warn-dot: #d97706;
  /* Inside the window's 10 px margin (body.mac): a shadow running past it was cut off
     square on the desktop (2026-11-10). */
  --shadow: 0 3px 7px rgba(0, 0, 0, 0.14), 0 1px 2px rgba(0, 0, 0, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #202124; --fg: #f3f4f6; --dim: #a1a1aa; --faint: #71717a;
    --line: rgba(255, 255, 255, 0.12); --track: rgba(255, 255, 255, 0.14); --hover: rgba(255, 255, 255, 0.08);
    --accent: #60a5fa; --ok: #4ade80; --bad: #f87171;
    --warn: #fbbf24; --warn-bg: #3a2d10; --warn-line: #6b5216; --warn-dot: #fbbf24;
    --shadow: 0 3px 7px rgba(0, 0, 0, 0.42), 0 1px 2px rgba(0, 0, 0, 0.32);
  }
}
html, body { margin: 0; background: transparent; overflow: hidden; }
body {
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI", "Segoe UI", "Noto Sans CJK SC", sans-serif;
  color: var(--fg); -webkit-user-select: none; user-select: none; cursor: default;
  font-variant-numeric: tabular-nums;
}
body.mac { padding: 10px; }            /* room for the shadow around a transparent window */
#root { position: relative; box-sizing: border-box; overflow: hidden; display: inline-block; background: var(--bg); border: 0.5px solid var(--line); cursor: default; }
#root.dragging, #root.dragging * { cursor: default; }
body.mac #root { box-shadow: var(--shadow); }
#root.pill { border-radius: 999px; }
#root.card { border-radius: 16px; width: 330px; box-sizing: border-box; }
body:not(.mac) #root { border-radius: 8px; border: none; }
#root.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
#root.warn::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: rgba(245, 158, 11, 0.17); z-index: 0;
  box-shadow: inset 0 0 0 2px var(--warn-dot), inset 0 0 16px rgba(217, 119, 6, 0.2);
  opacity: 0.2; animation: breathe 3.6s ease-in-out infinite;
}
.surface { position: relative; z-index: 1; transform-origin: var(--origin-x, right) var(--origin-y, top); }
body.grow-right { --origin-x: left; }
body.grow-left { --origin-x: right; }
body.grow-down { --origin-y: top; }
body.grow-up { --origin-y: bottom; }
#root.animating > .surface { position: absolute; top: 0; left: 0; }
body.grow-left #root.animating > .surface { left: auto; right: 0; }
body.grow-up #root.animating > .surface { top: auto; bottom: 0; }
#root.card > .surface { overflow-y: auto; max-height: var(--content-max-height, none); }
.fade .surface { animation: fade .22s ease-out; }
.folder-setting { margin: 12px 0; }
.folder-setting .folder-row { display:flex; gap:8px; margin-top:6px; }
.folder-setting input { width:0; min-width:0; flex:1; text-align:left; }
.folder-setting .hint { margin-top:5px; font-size:11px; color:var(--dim); }
@media (prefers-reduced-motion: reduce) { .fade .surface, #root.warn::after { animation:none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes breathe { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.85; } }

.attention-target { appearance: none; box-sizing: content-box; padding: 0; border: none; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.pill-prompt { display: inline-flex; align-items: center; gap: 8px; }
.attention-countdown { font-variant-numeric: tabular-nums; }
.attention-countdown:empty { display: none; }
.attention-target:focus-visible { outline: 2px solid var(--warn-dot); outline-offset: -2px; border-radius: 8px; }
.pillrow { display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 6px; white-space: nowrap; height: 28px; }
.pillrow.icon-first { padding-left: 12px; }
.count { font-weight: 600; font-size: 14px; }
.dim { color: var(--dim); }
.faint { color: var(--faint); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ring circle { fill: none; }
.ring .track { stroke: var(--track); }
.ring .fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray .4s ease; }

.card-body { padding: 16px 18px; }
.head { display: flex; align-items: center; gap: 12px; }
.head .drag { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.head .text { flex: 1; min-width: 0; }
.head .title { font-weight: 600; font-size: 14px; }
.head .sub { font-size: 12px; color: var(--dim); }
.iconbtn { background: none; border: none; padding: 4px; margin: -4px; border-radius: 6px; color: var(--dim); display: inline-flex; cursor: pointer; }
.iconbtn:hover { background: var(--hover); color: var(--fg); }
.paper { margin: 14px 0 12px; }
.paper .name { line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.paper .where { color: var(--faint); font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paper .notice { color: var(--accent); font-size: 12px; margin-top: 3px; }
.paper-link { display: block; width: 100%; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; border-radius: 6px; }
.paper-link .name, .paper-link .where, .paper-link .notice { display: block; }
.paper-link:hover .name { text-decoration: underline; }
.paper-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.steps { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.steps .bars { display: flex; gap: 3px; flex: 1; }
.steps .bars span { flex: 1; height: 3px; border-radius: 2px; background: var(--track); }
.steps .bars span.done { background: var(--ok); }
.steps .bars span.now { background: var(--accent); }
.steps .label { font-size: 12px; color: var(--accent); white-space: nowrap; }
.line { font-size: 12px; color: var(--dim); margin-top: 8px; }
.stats { display: flex; padding: 12px 0; border-top: 0.5px solid var(--line); border-bottom: 0.5px solid var(--line); }
.stats div, .stats .stat { flex: 1; }
.stats .stat { padding: 0; border: none; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.stats .stat:hover span, .stats .stat:focus-visible span { color: var(--accent); }
.stats .stat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.stats b { display: block; font-size: 18px; font-weight: 600; line-height: 1.2; }
.stats span { font-size: 11px; color: var(--dim); }
.actions { display: flex; align-items: center; gap: 6px; margin-top: 12px; position: relative; }
.actions .grow { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 4px; font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 8px;
       border: 0.5px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; }
.btn:hover { background: var(--hover); color: var(--fg); }
.btn.link { border: none; padding-left: 0; color: var(--accent); }
.btn.link:hover { background: none; text-decoration: underline; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--bad); }
#root.warn .btn { color: var(--warn); border-color: var(--warn-line); }
.confirm { margin-top: 12px; font-size: 12px; }
.confirm .row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
.menu { margin-top: 10px; border: 0.5px solid var(--line); border-radius: 10px; padding: 5px; }
.menu button { display: flex; justify-content: space-between; align-items: center; width: 100%; font: inherit; text-align: left;
               padding: 7px 10px; border: none; background: none; color: var(--fg); border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--hover); }
.menu hr { border: none; border-top: 0.5px solid var(--line); margin: 4px 6px; }
.menu .back { color: var(--dim); font-size: 12px; justify-content: flex-start; gap: 4px; }

.settings .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 0.5px solid var(--line); }
.settings input { width: 58px; height: 26px; box-sizing: border-box; text-align: right; font: inherit; color: var(--fg);
                  background: var(--hover); border: 0.5px solid var(--line); border-radius: 6px; padding: 0 8px; }
.settings input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.settings .err { color: var(--bad); font-size: 11px; text-align: right; margin: -6px 0 6px; }
/* The check of system notifications under its switch: a test, and what to change when they do not show. */
#notify-test-button { margin-left: auto; margin-right: 10px; }
#notify-test-button .btn { padding: 2px 9px; }
.nnote { font-size: 12px; color: var(--dim); margin: 2px 0 6px; }
.nnote.ok { color: var(--ok); }
.nnote.bad { color: var(--bad); }
.nnote .link-btn { border: none; background: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; }
.nbox { border-radius: 8px; padding: 9px 11px; margin: 4px 0 8px; font-size: 12px; line-height: 1.55;
        background: var(--warn-bg); color: var(--warn); border: 0.5px solid var(--warn-line); }
.nbox b { display: block; font-size: 13px; margin-bottom: 3px; }
.nbox ol { margin: 4px 0 6px; padding-left: 18px; }
.nbox .btn { margin-top: 2px; color: var(--warn); border-color: var(--warn-line); }
.switch { width: 34px; height: 20px; border-radius: 10px; background: var(--track); position: relative; border: none; padding: 0; cursor: pointer; }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch.on { background: var(--accent); }
.switch.on::after { left: 16px; }
.foot { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 0.5px solid var(--line); }
/* Settings: a home list of three pages, each row with its current values; then the page itself. */
.nav-row, .key-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 0; border: none; border-top: 0.5px solid var(--line);
                     background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.nav-row:first-child { margin-top: 8px; }
.nav-row:hover .nav-title, .key-row:hover .nav-title { color: var(--accent); }
.nav-row:focus-visible, .key-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
.nav-row svg.i:last-child { color: var(--faint); }
.nav-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.nav-sub { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.settings-note { font-size: 11px; color: var(--ok); margin-top: 8px; }
.key-group { font-size: 11px; color: var(--faint); margin: 12px 0 2px; }
.key-row.editing { cursor: default; }
.key-row.editing:hover .nav-title { color: inherit; }
.key-set { font-size: 12px; color: var(--ok); white-space: nowrap; }
.key-row .btn { pointer-events: none; }
.key-edit { background: var(--hover); border-radius: 8px; padding: 8px 10px; margin: 0 0 6px; }
.settings .key-edit input { width: 100%; text-align: left; background: var(--bg); }
.key-note { font-size: 11px; line-height: 1.5; color: var(--dim); margin-bottom: 8px; }
.key-edit .err { text-align: left; margin: 6px 0 0; }
.key-edit .err:empty { display: none; }
.key-edit .err.ok { color: var(--ok); }
.key-edit .err.wait { color: var(--dim); }
.key-links, .key-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.key-actions { gap: 6px; }
.key-links .grow, .key-actions .grow { flex: 1; }
.key-links .iconbtn { margin: 0; }
.iconbtn[aria-pressed="true"] { color: var(--accent); }
.strip { display: flex; align-items: center; gap: 6px; width: 100%; box-sizing: border-box; margin: 10px 0 2px; padding: 6px 10px;
         border-radius: 8px; border: 0.5px solid var(--line); background: var(--hover); color: var(--dim); font: inherit; font-size: 12px;
         text-align: left; cursor: pointer; }
.strip .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip svg.i { width: 14px; height: 14px; }
.strip.warn-strip { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
.seg { display: inline-flex; border: 0.5px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: inherit; font-size: 12px; padding: 3px 10px; border: none; background: none; color: var(--dim); cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }
.prompt { display: flex; align-items: center; gap: 10px; }
.prompt svg.i { width: 22px; height: 22px; }
.prompt .t { font-weight: 600; font-size: 14px; }
.prompt .s { font-size: 12px; }
.prompt.attention-target { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid var(--warn-line); border-radius: 13px; background: var(--warn-bg); }
.attention-copy { flex: 1; min-width: 0; }
.prompt.attention-target .t { white-space: nowrap; font-size: 15px; }
.prompt.attention-target .s { white-space: nowrap; margin-top: 3px; font-size: 11px; }
.attention-arrow { flex: none; font-size: 19px; }
.attention-head { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; color: var(--fg); }
.attention-head b { flex: 1; font-size: 12px; }
#root.card.warn { background: var(--bg); }

/* The finished card: totals, failures by reason, what was saved. No text wraps. */
.done-stats { margin-top: 12px; }
.sec { margin-top: 14px; }
.sec-h { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
.sec-h b { color: var(--fg); font-weight: 600; font-size: 13px; }
.list-sub { margin-top: 10px; }
.saved-line { font-size: 12px; color: var(--dim); line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grp { border-top: 0.5px solid var(--line); padding: 8px 0; }
.grp:last-child { border-bottom: 0.5px solid var(--line); }
.grp .row { display: flex; align-items: center; gap: 6px; width: 100%; padding: 0; border: none; background: none;
            font: inherit; color: inherit; text-align: left; white-space: nowrap; cursor: pointer; }
.grp .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.grp .row .reason { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.grp .row .n { font-weight: 600; }
.grp .row svg.i { width: 14px; height: 14px; color: var(--faint); }
.grp .m { font-size: 12px; color: var(--faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paper-list { list-style: none; margin: 6px 0 0; padding: 0; max-height: 196px; overflow-y: auto; }
.paper-list.scroll { -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent); mask-image: linear-gradient(to bottom, #000 80%, transparent); }
.paper-list li { font-size: 12px; padding: 3px 0; }
/* A list page scrolls as one, up to half the screen; its groups open in full inside it. */
.papers-scroll, .keys-scroll { overflow-y: auto; overscroll-behavior: contain; }
.papers-scroll .paper-list { max-height: none; overflow: visible; }
.paper-list .t, .paper-list .w { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paper-list .w, .paper-list .more { color: var(--faint); }
.paper-list .open-article { display: block; width: 100%; padding: 0; border: none; background: none; text-align: left;
  font: inherit; color: inherit; cursor: pointer; }
.paper-list .open-article:hover .t { color: var(--accent); text-decoration: underline; }
.paper-list .open-article:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
.tag { display: inline-block; font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 5px; flex: none; }
.tag.no_access, .tag.other { background: var(--hover); color: var(--fg); }
.tag.user_or_external { background: var(--warn-bg); color: var(--warn); }
.tag.unsupported { background: rgba(37, 99, 235, 0.12); color: var(--accent); }
.tag.unexplained { background: rgba(220, 38, 38, 0.12); color: var(--bad); }
</style>
</head>
<body>
<div id="root" class="pill capsule-drag-region"></div>
<script>
"use strict";
// English: the window's progress_language. The table (assets/capsule_en.json) is put
// in here when the window loads the page; every text shown passes through tr().
const EN = /*CAPSULE_EN*/null;
const EN_PATTERNS = EN ? EN.patterns.map(([source, target]) => [new RegExp(source), target]) : [];
const HAN = /[\u4e00-\u9fff]/;
let lang = "zh";
const BRACKETS = /^(.+?)（(.+)）$/;
function trOne(core) {
  if (!HAN.test(core)) return core;
  let english = Object.hasOwn(EN.exact, core) ? EN.exact[core] : null;
  if (english === null) {

    if (found) english = core.replace(found[0], found[1]);

  // "开放下载 18（出版社 API 3、预印本 1）": the text and what its brackets list, each on its own.
  if (parts) english = trOne(parts[1]) + " (" + parts[2].split("、").map(trOne).join(", ") + ")";
  return english === null ? core : english;
}
function tr(text) {

  return String(text).split(" · ").map((part) => {
    const core = part.trim();
    if (!core || !HAN.test(core)) return part;

    return english === core ? part : part.replace(core, english);

function localize(node) {

    for (const name of ["aria-label", "title", "placeholder"]) {

}
const ICONS = {
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  shield: '<path d="M12 3l8 3.5v5.5c0 4.6-3.4 8.1-8 9-4.6-.9-8-4.4-8-9V6.5z"/><path d="M9 12l2 2 4-4"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 9.5"/>',
  alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>',
  minimize: '<path d="M6 12h12"/>',
  close: '<path d="M7 7l10 10M17 7L7 17"/>',
  folder: '<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
  skip: '<path d="M6 6l8 6-8 6z"/><path d="M18 6v12"/>',
  stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="2"/>',
  dots: '<circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/>',
  left: '<path d="M15 6l-6 6 6 6"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  gear: gearPath(),
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L19 4M16 7l2.5 2.5M14 9l2 2"/>',
  eye: '<path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>',
  external: '<path d="M14 5h5v5M19 5l-8 8"/><path d="M18 14v4a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18V7a1.5 1.5 0 0 1 1.5-1.5H10"/>',
};
function gearPath() {
  // An eight-tooth gear, drawn here so no icon font or third-party artwork is needed.
  const pts = [];
  for (let i = 0; i < 32; i++) {

    pts.push((12 + r * Math.cos(a)).toFixed(2) + "," + (12 + r * Math.sin(a)).toFixed(2));

}

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ring(pct, size, stroke, label) {

  return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + " " + size + '" aria-hidden="true">'
    + '<circle class="track" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke-width="' + stroke + '"/>'
    + '<circle class="fill" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke-width="' + stroke + '" stroke-dasharray="'
    + d.toFixed(1) + " " + c.toFixed(1) + '" transform="rotate(-90 ' + size / 2 + " " + size / 2 + ')"/>'
    + (label ? '<text x="50%" y="50%" dy="0.35em" text-anchor="middle" font-size="11" fill="currentColor">' + label + "</text>" : "")
    + "</svg>";
}

const root = document.getElementById("root");
let V = { mode: "idle" };
let open = false;          // the card is showing
let panel = "";            // "", "menu", "report", "confirm", "settings": kept until the user leaves it
let flash = { text: "", until: 0 };
let settings = null, settingsErrors = {}, notifyOn = true;
let notifyCheck = null;  // the notification check under the switch: {state: testing, sent, off, unseen or failed}
// Settings pages: "home" lists download, wait and keys. settingsOnly: this window was started
// just to show them (`paper-search-carsi settings`), so it closes with them unless a download runs.
const SETTINGS_PAGES = ["home", "download", "wait", "keys"];
let settingsPage = "home", settingsNote = "", settingsOnly = false, lastStrip = "";
// Not "keys": in the pywebview window that name is taken, and declaring it stops the whole page.
let apiKeys = null, editing = "", editValues = {}, confirmClear = "", revealed = false;
let lastHtml = "", hoverTimer = 0, leaveTimer = 0, pollTimer = 0, kinds = [];
const api = () => window.pywebview.api;

function pill() {
  const v = V;
  if (v.mode === "attention") {
    const a = v.attention;
    return '<div class="pillrow icon-first capsule-drag-region">' + icon(a.login ? "lock" : "shield")
      + '<button type="button" class="pill-prompt attention-target" data-act="show_browser" title="点击切到下载浏览器" aria-label="打开下载浏览器">'
      + '<b>' + esc(a.short) + '</b><span class="attention-countdown"></span></button></div>';
  }
  if (v.mode === "done") {
    // "完成 38/40  2 篇失败": papers saved out of all; a check unless nothing was saved.
    const good = v.ok > 0 || !v.total;
    return '<div class="pillrow icon-first capsule-drag-region">'
      + icon(good ? "check" : "alert", ' style="color:var(' + (good ? "--ok" : "--bad") + ')"')
      + '<span class="count">' + (v.total ? esc(v.finished) + " " + v.ok + "/" + v.total : esc(v.headline)) + "</span>"
      + (v.bad ? '<span class="dim">' + v.bad + " 篇失败</span>" : "") + "</div>";
  }
  if (v.mode === "running") {
    const where = [v.part, v.publisher].filter(Boolean).join(" · ");
    return '<div class="pillrow capsule-drag-region">' + ring(v.pct, 24, 3)
      + '<span class="count">' + (v.total ? v.done + "/" + v.total : v.done) + "</span>"
      + (where ? '<span class="dim">' + esc(where) + "</span>" : "") + '<span class="dot"></span></div>';
  }
  return '<div class="pillrow icon-first capsule-drag-region"><b>PaperSearch</b><span class="dim">暂无下载任务</span></div>';
}

function header(title, sub, closable) {
  // Only the ring and the texts drag the window; the buttons stay clickable.
  return '<div class="head"><div class="drag capsule-drag-region">'
    + (V.mode === "running" || V.mode === "attention" ? ring(V.pct, 40, 4, V.pct + "%") : "")
    + '<div class="text"><div class="title">' + esc(title) + '</div>' + (sub ? '<div class="sub">' + esc(sub) + "</div>" : "") + "</div></div>"
    + '<button class="iconbtn" data-act="settings" aria-label="设置">' + icon("gear") + "</button>"
    + '<button class="iconbtn" data-act="' + (closable ? "close" : "minimize") + '" aria-label="' + (closable ? "关闭" : "最小化")
    + '" title="' + (closable ? "关闭" : "最小化到程序坞") + '">' + icon(closable ? "close" : "minimize") + "</button></div>";
}

function paperBlock() {
  const v = V;
  const note = flash.text && Date.now() < flash.until ? flash.text : v.notice;
  // The paper being downloaded: a click shows its browser while it has one (user request, 2026-11-08).
  const tag = v.browser ? "span" : "div";
  let html = '<div class="paper">' + (v.browser
    ? '<button type="button" class="paper-link" data-act="show_browser" title="点击切到下载浏览器" aria-label="切到下载浏览器">' : "")
    + "<" + tag + ' class="name">' + esc(v.title || v.current || "") + "</" + tag + ">";
  html += note ? "<" + tag + ' class="notice">' + esc(note) + "</" + tag + ">"
               : (v.where ? "<" + tag + ' class="where">' + esc(v.where) + (v.title && v.current ? " · " + esc(v.current) : "") + "</" + tag + ">" : "");
  if (v.browser) html += "</button>";
  if (v.step) {
    html += '<div class="steps"><div class="bars">' + v.steps.map((_, i) =>
      "<span" + (i < v.step.index ? ' class="done"' : i === v.step.index ? ' class="now"' : "") + "></span>").join("")
      + '</div><span class="label">' + esc(v.step.label) + "</span></div>";
  } else if (v.line) {
    html += '<div class="line">' + esc(v.line) + "</div>";
  }
  // What each lane got (开放下载, 机构下载), on one line.
  if (v.lanes) html += '<div class="line">' + esc(v.lanes) + "</div>";
  return html + "</div>";
}

function actionsBlock() {
  if (panel === "confirm") {
    return '<div class="confirm">终止整个下载任务？这一篇立即结束' + (V.stop_left ? "，剩下的 " + V.stop_left + " 篇不再下载。" : "。")
      + '<div class="row"><button class="btn" data-act="cancel">取消</button><button class="btn danger" data-act="stop">终止</button></div></div>';
  }
  let html = '<div class="actions">'
    + (V.folder ? '<button class="btn link" data-act="folder">' + icon("folder") + "文件夹</button>" : "")
    + '<span class="grow"></span>';
  if (V.actions) {
    html += '<button class="btn" data-act="skip_item">' + icon("skip") + "跳过</button>"
      + '<button class="btn" data-act="confirm">' + icon("stop") + "终止</button>"
      + '<button class="btn" data-act="menu" aria-label="更多">' + icon("dots") + "</button>";
  }
  html += "</div>";
  if (panel === "menu") {
    html += '<div class="menu"><button data-act="skip_journal">本刊无权限</button><button data-act="skip_publisher">出版社无权限</button>'
      + '<hr><button data-act="report">报告问题' + icon("right") + "</button></div>";
  } else if (panel === "report") {
    html += '<div class="menu"><button class="back" data-act="menu">' + icon("left") + "报告问题</button>"
      + kinds.map((k) => '<button data-act="issue" data-kind="' + esc(k[0]) + '">' + esc(k[1]) + "</button>").join("") + "</div>";
  }
  return html;
}

// A count opens its list of papers once the batch has sent them (user, 2026-11-10).
function stat(list, value, label, color) {
  const inner = "<b" + (color ? ' style="color:' + color + '"' : "") + ">" + value + "</b><span>" + label + "</span>";
  return V.lists && list ? '<button type="button" class="stat" data-act="papers" data-list="' + list + '">' + inner + "</button>"
    : "<div>" + inner + "</div>";
}

function runningCard() {
  const v = V;
  const sub = [v.total ? v.done + "/" + v.total : "", v.part, v.elapsed ? "已用 " + v.elapsed : ""].filter(Boolean).join(" · ");
  return '<div class="card-body">' + header(v.headline, sub, false) + paperBlock()
    + '<div class="stats">' + stat("ok", v.ok, "成功", "var(--ok)") + stat("failed", v.bad, "失败", "var(--bad)")
    + stat("left", v.left == null ? "—" : v.left, "剩余") + "</div>"
    + actionsBlock() + "</div>";
}

function attentionCard() {
  const a = V.attention;
  const title = a.short;
  let html = '<div class="card-body"><div class="attention-head capsule-drag-region"><b>PaperSearch</b>'
    + '<button class="iconbtn" data-act="minimize" aria-label="最小化">' + icon("minimize") + '</button>'
    + '<button class="iconbtn" data-act="close" aria-label="关闭">' + icon("close") + '</button></div>'
    + '<button type="button" class="prompt attention-target" data-act="show_browser" aria-label="打开下载浏览器">' + icon(a.login ? "lock" : "alert")
    + '<div class="attention-copy"><div class="t">' + esc(title) + '</div><div class="s">点击打开浏览器，查看并继续</div></div><span class="attention-arrow" aria-hidden="true">›</span></button>';
  if (panel === "confirm") return html + actionsBlock() + "</div>";
  html += '<div class="actions"><button class="iconbtn" data-act="settings" aria-label="设置">' + icon("gear")
    + '</button><span class="grow"></span>';
  if (V.actions) {
    html += '<button class="btn" data-act="skip_item">跳过本篇</button>'
      + '<button class="btn" data-act="confirm">终止</button>';
  }
  return html + "</div></div>";
}

const CLASS_TAGS = { no_access: "没权限", user_or_external: "外部原因", unsupported: "暂不支持", unexplained: "原因不明", other: "其他" };
let openGroups = null, groupsRun = "";  // null: each reason row as the view opens it
// Main-text rows first, then the supplementary files' rows, numbered on.
function allGroups() { return V.summary.groups.concat(V.summary.supplement_groups || []); }
function groupOpen(i) {
  if (groupsRun !== V.run_id) { openGroups = null; groupsRun = V.run_id; }
  return openGroups ? openGroups.has(i) : !!(allGroups()[i] || {}).open;
}
function toggleGroup(i) {
  const opened = !groupOpen(i);
  openGroups = new Set(opened ? [i] : []);  // one reason open at a time
  render(true);
}

function reasonRow(g, i, brief) {
  const opened = groupOpen(i);
  let html = '<div class="grp"><button type="button" class="row" data-act="group" data-group="' + i + '" aria-expanded="' + opened + '">'
    + '<span class="tag ' + esc(g.cls) + '">' + esc(CLASS_TAGS[g.cls] || "") + '</span><span class="reason">' + esc(g.reason) + "</span>"
    + '<span class="n">' + g.count + " 篇</span>" + icon(opened ? "down" : "right") + "</button>";
  if (!opened) return html + (g.where && !brief ? '<div class="m">' + esc(g.where) + "</div>" : "") + "</div>";
  return html + '<ul class="paper-list' + (g.papers.length > 5 ? " scroll" : "") + '">'
    + g.papers.map((p) => {
      const lines = '<div class="t">' + esc(p.title) + "</div>" + (p.where ? '<div class="w">' + esc(p.where) + "</div>" : "");
      // The article's page in the user's browser, to fetch it by hand (user, 2026-11-08).
      return "<li>" + (p.doi ? '<button type="button" class="open-article" data-act="open_article" data-doi="' + esc(p.doi)
        + '" title="在浏览器打开这篇文章">' + lines + "</button>" : lines) + "</li>";
    }).join("")
    + (g.more ? '<li class="more">另有 ' + g.more + " 篇未列出</li>" : "") + "</ul></div>";
}

function doneCard() {
  const v = V, s = v.summary;
  let html = '<div class="card-body">' + header(v.headline, v.total ? "共 " + v.total + " 篇" : "", true)
    + '<div class="stats done-stats">' + stat("ok", v.ok, "成功", "var(--ok)") + stat("failed", v.bad, "失败", v.bad ? "var(--bad)" : "")
    + stat("", esc(v.elapsed || "—"), "用时") + "</div>";
  if (s && s.groups.length) {
    const apart = s.supplement_groups && s.supplement_groups.length;
    html += '<div class="sec"><div class="sec-h"><b>' + (apart ? "正文未下到 " : "未完成 ") + v.bad + " 篇</b><span>按原因</span></div>"
      + s.groups.map((g, i) => reasonRow(g, i)).join("") + "</div>";
  }
  // Main text and supplementary files apart, kept short: closed rows, no journal line (user, 2026-11-08).
  if (s && s.supplement_groups && s.supplement_groups.length) {
    html += '<div class="sec"><div class="sec-h"><b>附录未下全 ' + s.supplement_missing + " 篇</b><span>正文已保存</span></div>"
      + s.supplement_groups.map((g, i) => reasonRow(g, s.groups.length + i, true)).join("") + "</div>";
  }
  if (s && v.ok) {
    html += '<div class="sec"><div class="sec-h"><b>已完成 ' + v.ok + " 篇</b></div>"
      + s.saved.map((line) => '<div class="saved-line">' + esc(line) + "</div>").join("") + "</div>";
  }
  if (v.completion_detail) html += '<div class="line">' + esc(v.completion_detail) + "</div>";
  return html + (v.folder ? '<div class="actions"><button class="btn link" data-act="folder">' + icon("folder") + "打开文件夹</button></div>" : "")
    + "</div>";
}

// The list behind a count: its groups (by way, by reason, by lane), each opened on its own.
const LIST_TITLES = { ok: "成功", failed: "失败", left: "剩余" };
let papersKind = "", papersList = null, listOpen = null;
function shownList() { return (papersList || {})[papersKind] || { count: 0, groups: [] }; }
function listGroupOpen(i) { return listOpen ? listOpen.has(i) : !!(shownList().groups[i] || {}).open; }
async function loadPapers() {
  try { papersList = await api().paper_lists(); } catch (e) { papersList = papersList || {}; }
}

function listRow(g, i) {
  const opened = listGroupOpen(i);
  let html = '<div class="grp"><button type="button" class="row" data-act="list_group" data-group="' + i + '" aria-expanded="' + opened + '">'
    + (papersKind === "failed" ? '<span class="tag ' + esc(g.cls) + '">' + esc(CLASS_TAGS[g.cls] || "") + "</span>" : "")
    + '<span class="reason">' + esc(g.label) + '</span><span class="n">' + g.count + " 篇</span>" + icon(opened ? "down" : "right") + "</button>";
  if (!opened) return html + "</div>";
  return html + '<ul class="paper-list">'
    + g.papers.map((p) => {
      const lines = '<div class="t">' + esc(p.title) + "</div>" + (p.where ? '<div class="w">' + esc(p.where) + "</div>" : "");
      // A saved paper shows its PDF in its folder; a failed one opens its article page, to fetch it by hand,
      // and so does one still waiting (user, 2026-11-11).
      if (papersKind === "ok") {
        return '<li><button type="button" class="open-article" data-act="show_paper" data-index="' + p.index + '" title="打开所在文件夹">' + lines + "</button></li>";
      }
      if ((papersKind === "failed" || papersKind === "left") && p.doi) {
        return '<li><button type="button" class="open-article" data-act="open_article" data-doi="' + esc(p.doi)
          + '" title="在浏览器打开这篇文章">' + lines + "</button></li>";
      }
      return "<li>" + lines + "</li>";
    }).join("")
    + (g.more ? '<li class="more">另有 ' + g.more + " 篇未列出</li>" : "") + "</ul></div>";
}

// A long list scrolls within half the screen at most, its title staying in place above it (user, 2026-11-10).
function listMaxHeight() { return Math.max(240, Math.round((screen.availHeight || 900) / 2) - 64); }

function papersCard() {
  const list = shownList();
  const note = flash.text && Date.now() < flash.until ? flash.text : "";
  let html = '<div class="card-body"><div class="head"><button class="iconbtn" data-act="back" aria-label="返回">' + icon("left") + "</button>"
    + '<div class="drag capsule-drag-region"><div class="text"><div class="title">' + LIST_TITLES[papersKind] + " " + list.count + " 篇</div></div></div></div>";
  if (note) html += '<div class="line">' + esc(note) + "</div>";
  if (!list.groups.length) html += '<div class="line">' + (papersList ? "没有论文" : "正在读取…") + "</div>";
  // Saved papers missing supplementary files follow the failed ones, as on the finished card (user, 2026-11-11).
  const heading = (g, i) => g.supplement && !(list.groups[i - 1] || {}).supplement
    ? '<div class="sec-h list-sub"><b>附录未下全 ' + (list.supplement_count || 0) + " 篇</b><span>正文已保存</span></div>" : "";
  return html + '<div class="sec papers-scroll" style="max-height:' + listMaxHeight() + 'px">'
    + list.groups.map((g, i) => heading(g, i) + listRow(g, i)).join("") + "</div></div>";
}

function idleCard() {
  return '<div class="card-body">' + header("PaperSearch", "暂无下载任务", true) + "</div>";
}

const busy = () => V.mode === "running" || V.mode === "attention";

function taskStrip() {
  // A download running behind the settings: one line, amber when it needs the user.
  if (V.mode === "attention") {
    return '<button type="button" class="strip warn-strip" data-act="show_browser">' + icon(V.attention.login ? "lock" : "alert")
      + '<span class="grow">' + esc(V.attention.short) + "</span><span>去处理 ›</span></button>";
  }
  if (V.mode === "running") {
    return '<button type="button" class="strip" data-act="progress"><span class="grow">正在下载 '
      + esc(V.total ? V.done + "/" + V.total : V.done) + (V.publisher ? " · " + esc(V.publisher) : "")
      + "</span><span>返回进度 ›</span></button>";
  }
  return "";
}

function settingsHead(title) {
  // A window opened just for the settings closes from any page; the home page has nothing to go back to.
  const closable = settingsOnly && !busy(), home = settingsPage === "home";
  lastStrip = taskStrip();
  return '<div class="head">' + (home && closable ? "" : '<button class="iconbtn" data-act="back" aria-label="返回">' + icon("left") + "</button>")
    + '<div class="drag capsule-drag-region"><div class="text"><div class="title">' + esc(title) + "</div>"
    + (home ? "" : '<div class="sub">设置</div>') + "</div></div>"
    + (closable ? '<button class="iconbtn" data-act="close_settings" aria-label="关闭">' + icon("close") + "</button>" : "")
    + '</div><div id="task-strip">' + lastStrip + "</div>";
}

const fieldsOn = (page) => settings.fields.filter((f) => (f.page || "wait") === page);
const field = (name) => settings.fields.find((f) => f.name === name);

function settingsHome() {
  const hourly = field("hourly"), login = field("login");
  const rows = [
    ["download", "folder", "下载", [settings.download_dir, hourly ? "每家每小时 " + hourly.value + " 篇" : ""]],
    ["wait", "clock", "等待和提醒", [login ? "登录页 " + login.value + " 秒" : "", "系统通知" + (notifyOn ? "开" : "关")]],
    ["keys", "key", "API key", [apiKeys && apiKeys.ok ? "已填 " + apiKeys.filled + "/" + apiKeys.total : ""]],
  ];
  return settingsHead("设置") + rows.map(([page, glyph, title, sub]) =>
    '<button type="button" class="nav-row" data-act="settings_page" data-page="' + page + '">' + icon(glyph)
    + '<span class="nav-text"><span class="nav-title">' + title + '</span><span class="nav-sub">'
    + esc(sub.filter(Boolean).join(" · ")) + "</span></span>" + icon("right") + "</button>").join("")
    // The language row reads the same in both languages.
    + '<div class="row"><span>语言</span><span class="seg">' + ["zh", "en"].map((code) => '<button type="button" data-act="language" data-lang="'
      + code + '" aria-pressed="' + (lang === code) + '"' + (lang === code ? ' class="on"' : "") + ">" + (code === "zh" ? "中文" : "English")
      + "</button>").join("") + "</span></div>"
    + (settingsNote ? '<div class="settings-note" role="status">' + esc(settingsNote) + "</div>" : "");
}

function fieldRows(page) {
  return fieldsOn(page).map((f) => '<div class="row"><span>' + esc(f.label) + '</span><span><input data-field="' + esc(f.name)
    + '" value="' + esc(f.value) + '" aria-label="' + esc(f.label) + '" inputmode="numeric"> <span class="dim">' + esc(f.unit) + "</span></span></div>"
    + (settingsErrors[f.name] ? '<div class="err">' + esc(settingsErrors[f.name]) + "</div>" : "")).join("");
}

function settingsFoot() {
  return (settingsErrors[""] ? '<div class="err">' + esc(settingsErrors[""]) + "</div>" : "")
    + '<div class="foot"><button class="btn link" style="color:var(--dim)" data-act="defaults">恢复默认</button>'
    + '<button class="btn primary" data-act="save">保存</button></div>';
}

function settingsDownload() {
  return settingsHead("下载")
    + '<div class="folder-setting"><label for="download-dir">默认下载文件夹</label><div class="folder-row">'
    + '<input id="download-dir" type="text" value="' + esc(settings.download_dir || '') + '" placeholder="输入完整路径">'
    + '<button class="btn" data-act="choose_folder">选择…</button></div>'
    + '<div class="hint">用于后续下载；命令中指定路径时优先使用指定路径。</div>'
    + (settingsErrors.download_dir ? '<div class="err">' + esc(settingsErrors.download_dir) + '</div>' : '') + '</div>'
    + fieldRows("download") + settingsFoot();
}

function settingsWait() {
  return settingsHead("等待和提醒") + fieldRows("wait")
    + '<div class="row"><span>需要处理时发系统通知</span><span id="notify-test-button">' + notifyTestButton() + "</span>"
    + '<button class="switch' + (notifyOn ? " on" : "")
    + '" data-act="notify" role="switch" aria-checked="' + notifyOn + '" aria-label="系统通知"></button></div>'
    + '<div id="notify-test">' + notifyTest() + "</div>"
    + '<div class="err" id="notify-error" role="status"></div>' + settingsFoot();
}

function keyRow(s) {
  const name = '<span class="nav-text"><span class="nav-title">' + esc(s.name) + "</span>"
    + (s.use ? '<span class="nav-sub">' + esc(s.use) + "</span>" : "") + "</span>";
  if (editing !== s.id) {
    return '<button type="button" class="key-row" data-act="edit_key" data-service="' + esc(s.id) + '">' + name
      + (s.set ? '<span class="key-set">' + esc(s.masked) + "</span>" : '<span class="btn">填写</span>') + "</button>";
  }
  let html = '<div class="key-row editing">' + name
    + (s.set ? '<span class="key-set">' + esc(s.masked) + "</span>" : '<span class="dim" style="font-size:12px">未填</span>')
    + '</div><div class="key-edit">';
  // A saved key is in its field, hidden until the eye shows it.
  // A contact email: what it is for above its field, and the field in plain text (user, 2026-11-11).
  const emails = s.keys.every((k) => k.kind === "email");
  if (s.note) html += '<div class="key-note">' + esc(s.note) + "</div>";
  for (const k of s.keys) {
    html += '<input id="key-' + esc(k.key) + '" data-key="' + esc(k.key) + '" type="' + (revealed || k.kind === "email" ? "text" : "password")
      + '" value="' + esc(editValues[k.key] || "") + '" autocomplete="off" spellcheck="false" aria-label="' + esc(s.name + " " + k.label)
      + '" placeholder="' + (k.kind === "email" ? "填你常用的邮箱" : "粘贴 key") + '">';

  setHover(pointer.inside, force);
}
root.addEventListener("mouseenter", () => observeHover(true));
root.addEventListener("mouseleave", () => {
  attentionPointer = null;
  observeHover(false);
});
function endAttentionPress(event) {
  if (attentionPointer === null || (event.pointerId !== undefined && attentionPointer !== event.pointerId)) return;
  attentionPointer = null;
  observeHover(root.matches(":hover"), true);
}
window.addEventListener("pointerup", endAttentionPress);
window.addEventListener("pointercancel", endAttentionPress);
window.addEventListener("blur", endAttentionPress);
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && panel) {
    if (panel !== "settings") { panel = ""; render(true); }
    else act(editing ? "cancel_key" : "back");
  }
  if (event.key === "Enter" && panel === "settings" && event.target.tagName === "INPUT") {
    if (settingsPage === "keys" && editing) act("save_key", { dataset: { service: editing }, textContent: "" });
    else if (settingsPage === "download" || settingsPage === "wait") act("save");
  }
});

window.addEventListener("pywebviewready", async () => {
  const platform = await api().platform();
  document.body.classList.add(platform === "darwin" ? "mac" : platform === "win32" ? "win" : "other");
  await tick();
  pollTimer = setInterval(tick, 500);
});
</script>
</body>
