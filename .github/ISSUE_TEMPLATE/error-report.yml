name: "程序出错 · Bug report"
description: "安装、命令、检索、进度胶囊等报错或结果不对（下载失败请用上一个模板）。· Errors or wrong results in installation, commands, search or the progress capsule (download failures: use the template above)."
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: "PaperSearch 版本 / Version"
      description: "运行 paper-search --version。· Run paper-search --version."
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: "操作系统 / Operating system"
      placeholder: "macOS / Windows / Linux，系统版本 / version"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "怎么出现的 / How it happened"
      description: "运行的命令，或对 AI 说的话；能复现的话写出步骤。· The command you ran or what you asked the AI; steps to reproduce if you can."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: "实际结果与预期 / Actual and expected result"
      description: "报错信息可以直接粘贴；截图请拖到这里。· Paste error messages; drag screenshots here."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "公开前检查 / Before posting"
      options:
        - label: "我已检查文字和截图，不含 API key、学校账号、姓名、邮箱或其他个人信息。· I checked the text and screenshots for API keys, school accounts, names, email and other personal information."
          required: true
