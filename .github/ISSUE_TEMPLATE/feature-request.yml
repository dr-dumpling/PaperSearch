name: "功能建议 · Feature request"
description: "希望增加的功能或改进。· A feature or improvement you would like."
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: "想要什么 / What you would like"
      description: "希望 PaperSearch 能做什么，或现有功能哪里可以改进。· What PaperSearch should do, or what could work better."
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: "使用场景 / When you would use it"
      description: "在什么情况下会用到，现在是怎么做的。· The situation, and how you do it today."
